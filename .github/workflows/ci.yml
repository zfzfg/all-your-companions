name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Three operating systems, because each breaks assumptions the others share.
  # Windows is the maintainer's platform and carries its own code paths (shell
  # selection in terminal-manager.ts, PATHEXT and .cmd lookup in cli-path.ts /
  # cli-locator.ts, taskkill tree teardown). macOS's `os.tmpdir()` is a symlink
  # (`/var/folders/…` → `/private/var/…`), which catches code that canonicalises
  # paths. Ubuntu is what the integration job runs on.
  # `fail-fast: false` so one platform's failure never hides another's.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # The VSIX is platform-independent, so building it twice buys nothing.
      - run: npm run package
        if: matrix.os == 'ubuntu-latest'

  # @vscode/test-electron smoke — boots a real VS Code, activates the extension, and
  # resolves the webview (missing-CLI onboarding path; no grok binary needed). Covers the
  # host glue the grok-free unit suite can't. Needs a virtual display on Linux (xvfb).
  # Required gate: validated passing against a real Extension Host (VS Code 1.128.0). If a
  # Linux/xvfb-specific quirk ever surfaces here, fix it — don't demote the gate to advisory.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: xvfb-run -a npm run test:integration
